# AIFeed content serving for nginx (files generated by `aifeed site build`).
#
# `aifeed site build --profile both` writes /path.aifeed.md and /path.mako.md
# (plus nested /dir/index.*.md for directory indexes), each with a .sig sidecar.
# Agents that send `Accept: text/aifeed+markdown` (or text/mako+markdown) receive
# the matching file with the correct media type; everyone else gets HTML.

map $http_accept $aifeed_ext {
    default                        "";
    "~*text/aifeed\+markdown"      ".aifeed.md";
    "~*text/mako\+markdown"        ".mako.md";
}

server {
    listen 443 ssl;
    server_name example.com;
    root /var/www/site;

    # Manifest, signature, index, and sidecars stay plain static files
    location /.well-known/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(aifeed|mako)\.md\.sig$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.aifeed\.md$ {
        default_type text/aifeed+markdown;
        add_header Vary "Accept" always;
        add_header X-Aifeed-Profile "aimd" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.mako\.md$ {
        default_type text/mako+markdown;
        add_header Vary "Accept" always;
        add_header X-Aifeed-Profile "mako" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Negotiation: try the flat file, then the directory index, then HTML
    location / {
        try_files $uri$aifeed_ext $uri/index$aifeed_ext $uri $uri/ /index.html =404;
        add_header Vary "Accept" always;
    }
}
